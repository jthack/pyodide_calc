<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyodide Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
</head>
<body>
    <h1>Calculator (Powered by Python via Pyodide!)</h1>
    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendOperator('/')">/</button>
            <button onclick="appendOperator('*')">*</button>
            <button onclick="appendOperator('-')">-</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="appendOperator('+')">+</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button id="equals" onclick="calculateResult()">=</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>


            <button onclick="appendNumber('0')" class="zero">0</button>
            <button onclick="appendNumber('.')">.</button>

        </div>
         <div id="loading-status" class="loading">Loading Pyodide & Python Runtime...</div>
         <div id="error-message" class="error"></div>
    </div>

    <script src="script.js"></script>
    <footer>
        <p>Inspired by Simon Willison's use of Pyodide on static sites like <a href="https://datasette.io/" target="_blank" rel="noopener noreferrer">Datasette Lite</a>.</p>
    </footer>
</body>
</html>
